[workspace]
resolver = "2"
members = [
    "crates/voxforg-core",
    "crates/voxforg-hardware",
    "crates/voxforg-audio",
    "crates/voxforg-engine",
    "crates/voxforg-router",
    "crates/voxforg-pronunciation",
    "crates/voxforg-pipeline",
    "crates/voxforg-benchmark",
    "crates/voxforg-worker",
    "crates/voxforg-api",
    "crates/voxforg-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["VoxForg Core Contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/voxforg/voxforg"
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
futures = "0.3"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.10"
hound = "3.5"
sysinfo = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
http-body-util = "0.1"
subtle = "2.5"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
sha2 = "0.10"
hex = "0.4"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }

# Internal workspace crates
voxforg-core          = { path = "crates/voxforg-core" }
voxforg-hardware      = { path = "crates/voxforg-hardware" }
voxforg-audio         = { path = "crates/voxforg-audio" }
voxforg-engine        = { path = "crates/voxforg-engine" }
voxforg-router        = { path = "crates/voxforg-router" }
voxforg-pronunciation = { path = "crates/voxforg-pronunciation" }
voxforg-pipeline      = { path = "crates/voxforg-pipeline" }
voxforg-benchmark     = { path = "crates/voxforg-benchmark" }
voxforg-worker        = { path = "crates/voxforg-worker" }
voxforg-api           = { path = "crates/voxforg-api" }

[profile.dev]
debug = 0

[profile.test]
debug = 0
